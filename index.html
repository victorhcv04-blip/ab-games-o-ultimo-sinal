
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AB GAMES | O ÚLTIMO SINAL</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#020604;
  color:white;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

#scene{
  position:fixed;
  inset:0;
  z-index:0;
}

canvas{display:block}

.shade{
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none;
  background:
    linear-gradient(90deg,rgba(0,0,0,.78),rgba(0,0,0,.12)),
    linear-gradient(0deg,rgba(0,0,0,.75),transparent 75%);
}

.menu{
  position:fixed;
  inset:0;
  z-index:2;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:flex-start;
  padding:9%;
  pointer-events:none;
}

.menu>*{pointer-events:auto}

.logo{
  font-size:19px;
  font-weight:900;
  letter-spacing:7px;
  margin-bottom:65px;
  color:#fff;
}

.logo span{color:#67db96}

.tag{
  color:#8caa96;
  font-size:11px;
  letter-spacing:6px;
  margin-bottom:18px;
}

h1{
  font-size:clamp(40px,7vw,82px);
  font-weight:900;
  line-height:.95;
  letter-spacing:2px;
  text-shadow:0 5px 30px #000;
}

h1 span{color:#69d995}

.description{
  color:#b8c6bc;
  font-size:13px;
  letter-spacing:2px;
  margin-top:25px;
  line-height:1.6;
  max-width:400px;
}

#play{
  margin-top:42px;
  width:220px;
  padding:18px;
  background:#347d50;
  border:1px solid #83e5a4;
  color:white;
  font-size:14px;
  font-weight:bold;
  letter-spacing:5px;
  cursor:pointer;
  transition:.3s;
}

#play:hover{
  background:#4ca96d;
  box-shadow:0 0 30px #347d5066;
  transform:scale(1.04);
}

.footer{
  position:fixed;
  z-index:3;
  bottom:20px;
  left:25px;
  right:25px;
  display:flex;
  justify-content:space-between;
  color:#9ba99f;
  font-size:10px;
  letter-spacing:2px;
  pointer-events:none;
}

#transition{
  position:fixed;
  inset:0;
  z-index:5;
  background:#000;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  padding:20px;
}

#transition h2{
  color:#75d99a;
  letter-spacing:5px;
  font-size:25px;
}

#transition p{
  margin-top:15px;
  color:#aaa;
  font-size:12px;
  letter-spacing:3px;
}

@media(max-width:600px){
  .menu{padding:8%}
  .logo{margin-bottom:55px}
  .description{font-size:10px}
  #play{width:190px}
}
</style>
</head>

<body>

<div id="scene"></div>
<div class="shade"></div>

<div class="menu">
  <div class="logo">AB <span>GAMES</span></div>
  <div class="tag">UMA EXPERIÊNCIA DE MISTÉRIO</div>
  <h1>O ÚLTIMO<br><span>SINAL</span></h1>

  <p class="description">
    ALGUNS SEGREDOS DEVERIAM PERMANECER ESCONDIDOS.
  </p>

  <button id="play">JOGAR</button>
</div>

<div class="footer">
  <span>AB GAMES</span>
  <span>GRÁFICOS AUTO</span>
  <span>V. 2.1</span>
</div>

<div id="transition">
  <h2>O ÚLTIMO SINAL</h2>
  <p>PREPARANDO A FLORESTA...</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>

<script>
const container=document.getElementById("scene");

let scene,camera,renderer;
let particles;
let flashlightGroup;
let flashlightBeam;
let clock=new THREE.Clock();
let elapsed=0;

const dummy=new THREE.Object3D();

function random(min,max){
  return Math.random()*(max-min)+min;
}

// TEXTURA DA CASCA
function createBarkTexture(){
  const canvas=document.createElement("canvas");
  canvas.width=512;
  canvas.height=512;

  const ctx=canvas.getContext("2d");

  ctx.fillStyle="#49372a";
  ctx.fillRect(0,0,512,512);

  for(let i=0;i<1300;i++){
    const x=random(0,512);
    const y=random(0,512);
    const w=random(1,7);
    const h=random(5,65);
    const shade=Math.floor(random(25,100));

    ctx.fillStyle=`rgba(${shade},${shade*.72},${shade*.48},${random(.08,.35)})`;
    ctx.fillRect(x,y,w,h);
  }

  for(let i=0;i<70;i++){
    const x=random(0,512);
    const y=random(0,512);

    ctx.strokeStyle="rgba(12,9,6,.35)";
    ctx.lineWidth=random(1,4);

    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(x+random(-4,4),y+random(15,70));
    ctx.stroke();
  }

  const texture=new THREE.CanvasTexture(canvas);
  texture.wrapS=THREE.RepeatWrapping;
  texture.wrapT=THREE.RepeatWrapping;
  texture.colorSpace=THREE.SRGBColorSpace;

  return texture;
}

// TEXTURA DO SOLO
function createGroundTexture(){
  const canvas=document.createElement("canvas");
  canvas.width=1024;
  canvas.height=1024;

  const ctx=canvas.getContext("2d");

  ctx.fillStyle="#302c21";
  ctx.fillRect(0,0,1024,1024);

  for(let i=0;i<18000;i++){
    const x=random(0,1024);
    const y=random(0,1024);
    const size=random(1,5);
    const shade=Math.floor(random(20,75));

    ctx.fillStyle=`rgba(${shade},${shade*.9},${shade*.65},${random(.12,.5)})`;
    ctx.fillRect(x,y,size,size);
  }

  // Folhas secas
  for(let i=0;i<1600;i++){
    const x=random(0,1024);
    const y=random(0,1024);

    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(random(0,Math.PI));

    ctx.fillStyle=[
      "#625039","#493c27","#796044",
      "#352f22","#6b5438"
    ][Math.floor(random(0,5))];

    ctx.beginPath();
    ctx.ellipse(0,0,random(2,7),random(1,3),0,0,Math.PI*2);
    ctx.fill();

    ctx.restore();
  }

  // Musgo
  for(let i=0;i<500;i++){
    ctx.fillStyle=`rgba(49,91,48,${random(.08,.25)})`;
    ctx.beginPath();
    ctx.arc(random(0,1024),random(0,1024),random(2,9),0,Math.PI*2);
    ctx.fill();
  }

  const texture=new THREE.CanvasTexture(canvas);
  texture.wrapS=THREE.RepeatWrapping;
  texture.wrapT=THREE.RepeatWrapping;
  texture.repeat.set(5,12);
  texture.colorSpace=THREE.SRGBColorSpace;

  return texture;
}

// FLORESTA
function createForest(){

  const count=230;
  const barkTexture=createBarkTexture();

  const trunkGeometry=new THREE.CylinderGeometry(
    .42,.65,11,8,3
  );

  const trunkMaterial=new THREE.MeshStandardMaterial({
    map:barkTexture,
    color:0x9a8065,
    roughness:1
  });

  const trunks=new THREE.InstancedMesh(
    trunkGeometry,trunkMaterial,count
  );

  const canopyGeometry=new THREE.ConeGeometry(1,1,8,2);

  const canopyMaterial=new THREE.MeshStandardMaterial({
    color:0x183323,
    roughness:1,
    flatShading:true
  });

  const canopies=new THREE.InstancedMesh(
    canopyGeometry,canopyMaterial,count*4
  );

  const rootGeometry=new THREE.CylinderGeometry(
    .045,.13,1,5
  );

  const rootMaterial=new THREE.MeshStandardMaterial({
    color:0x392b20,
    roughness:1
  });

  const roots=new THREE.InstancedMesh(
    rootGeometry,rootMaterial,count*3
  );

  let canopyIndex=0;
  let rootIndex=0;

  for(let i=0;i<count;i++){

    const side=Math.random()<.5?-1:1;
    const x=side*random(5,32);
    const z=random(-230,22);

    const height=random(9,16);
    const width=random(.8,1.4);

    // Tronco
    dummy.position.set(x,height/2,z);
    dummy.scale.set(width,height/11,width);
    dummy.rotation.set(0,random(0,Math.PI),0);
    dummy.updateMatrix();

    trunks.setMatrixAt(i,dummy.matrix);

    // Copas
    for(let layer=0;layer<4;layer++){

      const scale=1.7-layer*.27;
      const y=height*(.42+layer*.14);

      dummy.position.set(
        x+random(-.12,.12),
        y,
        z+random(-.12,.12)
      );

      dummy.scale.set(
        scale*width,
        4.5,
        scale*width
      );

      dummy.rotation.set(0,random(0,Math.PI),0);
      dummy.updateMatrix();

      canopies.setMatrixAt(canopyIndex++,dummy.matrix);
    }

    // Raízes
    for(let r=0;r<3;r++){

      const angle=(r/3)*Math.PI*2+random(-.3,.3);
      const length=random(1,2.1);

      dummy.position.set(
        x+Math.cos(angle)*length*.4,
        .12,
        z+Math.sin(angle)*length*.4
      );

      dummy.scale.set(.8,length,.8);
      dummy.rotation.set(
        0,angle,
        Math.PI/2+random(-.15,.15)
      );

      dummy.updateMatrix();
      roots.setMatrixAt(rootIndex++,dummy.matrix);
    }
  }

  trunks.instanceMatrix.needsUpdate=true;
  canopies.instanceMatrix.needsUpdate=true;
  roots.instanceMatrix.needsUpdate=true;

  scene.add(trunks);
  scene.add(canopies);
  scene.add(roots);
}

// PEDRAS
function createRocks(){

  const geometry=new THREE.DodecahedronGeometry(1,0);

  const material=new THREE.MeshStandardMaterial({
    color:0x41443d,
    roughness:1,
    flatShading:true
  });

  const rocks=new THREE.InstancedMesh(
    geometry,material,180
  );

  for(let i=0;i<180;i++){

    const side=Math.random()<.5?-1:1;

    dummy.position.set(
      side*random(2,35),
      random(.05,.2),
      random(-220,20)
    );

    dummy.scale.set(
      random(.12,.7),
      random(.1,.35),
      random(.15,.65)
    );

    dummy.rotation.set(
      random(0,2),
      random(0,Math.PI),
      random(0,2)
    );

    dummy.updateMatrix();
    rocks.setMatrixAt(i,dummy.matrix);
  }

  rocks.instanceMatrix.needsUpdate=true;
  scene.add(rocks);
}

// VEGETAÇÃO
function createVegetation(){

  const geometry=new THREE.ConeGeometry(.18,1.2,5);

  const material=new THREE.MeshStandardMaterial({
    color:0x263e25,
    roughness:1,
    flatShading:true
  });

  const plants=new THREE.InstancedMesh(
    geometry,material,650
  );

  for(let i=0;i<650;i++){

    const side=Math.random()<.5?-1:1;

    dummy.position.set(
      side*random(2,24),
      .45,
      random(-220,20)
    );

    dummy.scale.set(
      random(.5,1.5),
      random(.4,1.8),
      random(.5,1.5)
    );

    dummy.rotation.set(
      random(-.15,.15),
      random(0,Math.PI),
      random(-.15,.15)
    );

    dummy.updateMatrix();
    plants.setMatrixAt(i,dummy.matrix);
  }

  plants.instanceMatrix.needsUpdate=true;
  scene.add(plants);
}

// CHÃO
function createGround(){

  const geometry=new THREE.PlaneGeometry(
    100,280,80,160
  );

  const texture=createGroundTexture();

  const material=new THREE.MeshStandardMaterial({
    map:texture,
    color:0x999487,
    roughness:1
  });

  const ground=new THREE.Mesh(geometry,material);

  ground.rotation.x=-Math.PI/2;
  ground.position.set(0,-.08,-100);

  scene.add(ground);
}

// PARTÍCULAS
function createParticles(){

  const positions=[];

  for(let i=0;i<450;i++){
    positions.push(
      random(-35,35),
      random(.2,13),
      random(-220,20)
    );
  }

  const geometry=new THREE.BufferGeometry();

  geometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(positions,3)
  );

  const material=new THREE.PointsMaterial({
    color:0xa5bba9,
    size:.045,
    transparent:true,
    opacity:.3,
    depthWrite:false
  });

  particles=new THREE.Points(geometry,material);
  scene.add(particles);
}

// LANTERNA NA MÃO DO JOGADOR
function createFlashlight(){

  flashlightGroup=new THREE.Group();

  // Corpo principal da lanterna
  const bodyMaterial=new THREE.MeshStandardMaterial({
    color:0x171b1b,
    metalness:.8,
    roughness:.32
  });

  const body=new THREE.Mesh(
    new THREE.CylinderGeometry(.065,.075,.42,16),
    bodyMaterial
  );

  body.rotation.x=Math.PI/2;
  body.position.z=-.13;
  flashlightGroup.add(body);

  // Cabeça da lanterna
  const head=new THREE.Mesh(
    new THREE.CylinderGeometry(.115,.085,.14,20),
    new THREE.MeshStandardMaterial({
      color:0x292f2e,
      metalness:.85,
      roughness:.25
    })
  );

  head.rotation.x=Math.PI/2;
  head.position.z=-.39;
  flashlightGroup.add(head);

  // Aro metálico
  const ring=new THREE.Mesh(
    new THREE.TorusGeometry(.103,.012,8,24),
    new THREE.MeshStandardMaterial({
      color:0x89938e,
      metalness:.95,
      roughness:.2
    })
  );

  ring.position.z=-.465;
  flashlightGroup.add(ring);

  // Lente
  const lens=new THREE.Mesh(
    new THREE.CircleGeometry(.087,24),
    new THREE.MeshBasicMaterial({
      color:0xd8f0d8
    })
  );

  lens.position.z=-.468;
  flashlightGroup.add(lens);

  // Botão lateral
  const switchButton=new THREE.Mesh(
    new THREE.SphereGeometry(.025,10,8),
    new THREE.MeshStandardMaterial({
      color:0x69d995,
      metalness:.4,
      roughness:.4
    })
  );

  switchButton.position.set(.075,.025,-.12);
  flashlightGroup.add(switchButton);

  // Mão com luva escura
  const glove=new THREE.Mesh(
    new THREE.SphereGeometry(1,16,12),
    new THREE.MeshStandardMaterial({
      color:0x252b28,
      roughness:1
    })
  );

  glove.scale.set(.115,.095,.16);
  glove.position.set(-.09,-.11,.015);
  flashlightGroup.add(glove);

  // Punho da luva
  const cuff=new THREE.Mesh(
    new THREE.CylinderGeometry(.075,.085,.16,10),
    new THREE.MeshStandardMaterial({
      color:0x171d19,
      roughness:1
    })
  );

  cuff.rotation.x=Math.PI/2;
  cuff.position.set(-.09,-.105,.14);
  flashlightGroup.add(cuff);

  // Posição da lanterna na câmera
  flashlightGroup.position.set(.46,-.39,-.78);
  flashlightGroup.rotation.set(-.12,-.08,-.12);

  camera.add(flashlightGroup);

  // Feixe visual suave
  const beamGeometry=new THREE.CylinderGeometry(
    2.15,.075,8,24,1,true
  );

  const beamMaterial=new THREE.MeshBasicMaterial({
    color:0xd9f4d7,
    transparent:true,
    opacity:.045,
    side:THREE.DoubleSide,
    depthWrite:false,
    blending:THREE.AdditiveBlending
  });

  flashlightBeam=new THREE.Mesh(
    beamGeometry,
    beamMaterial
  );

  // A ponta estreita fica perto da lanterna
  flashlightBeam.rotation.x=-Math.PI/2;
  flashlightBeam.position.set(.46,-.39,-4.78);

  camera.add(flashlightBeam);

  // Luz principal
  const spot=new THREE.SpotLight(
    0xe0f4dc,
    85,
    32,
    .38,
    .65,
    1.4
  );

  spot.position.set(.46,-.36,-.72);

  const target=new THREE.Object3D();
  target.position.set(.46,-.65,-25);

  camera.add(spot);
  camera.add(target);

  spot.target=target;

  // Luz próxima da lanterna
  const glow=new THREE.PointLight(
    0xc9efc6,
    1.5,
    4
  );

  glow.position.set(.46,-.36,-.85);
  camera.add(glow);
}

// ILUMINAÇÃO AMBIENTE
function createLighting(){

  scene.add(
    new THREE.HemisphereLight(
      0x526b59,
      0x10140e,
      1.1
    )
  );

  const moon=new THREE.DirectionalLight(
    0x9bb9a2,.65
  );

  moon.position.set(-8,18,5);
  scene.add(moon);

  const ambient=new THREE.AmbientLight(
    0x26382b,.35
  );

  scene.add(ambient);
}

// INICIALIZAÇÃO
function init(){

  scene=new THREE.Scene();

  scene.background=new THREE.Color(0x030805);
  scene.fog=new THREE.FogExp2(0x071009,.014);

  camera=new THREE.PerspectiveCamera(
    65,
    window.innerWidth/window.innerHeight,
    .1,
    300
  );

  camera.position.set(0,2.2,12);
  camera.rotation.order="YXZ";

  const isMobile=/Android|iPhone|iPad/i.test(
    navigator.userAgent
  );

  renderer=new THREE.WebGLRenderer({
    antialias:!isMobile,
    powerPreference:"high-performance"
  });

  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio||1,1.35)
  );

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.1;

  container.appendChild(renderer.domElement);

  createLighting();
  createGround();
  createForest();
  createRocks();
  createVegetation();
  createParticles();

  // Adiciona a lanterna depois de criar a câmera
  createFlashlight();

  window.addEventListener("resize",resize);

  animate();
}

// TAMANHO DA TELA
function resize(){

  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio||1,1.35)
  );
}

// ANIMAÇÃO
function animate(){

  requestAnimationFrame(animate);

  const delta=Math.min(clock.getDelta(),.05);
  elapsed+=delta;

  const transition=document.getElementById("transition");

  if(transition.style.display!=="flex"){

    camera.position.z=12-elapsed*.28;

    camera.position.y=
      2.2+Math.sin(elapsed*.45)*.045;

    camera.position.x=
      Math.sin(elapsed*.22)*.25;

    // Balanço suave da lanterna
    if(flashlightGroup){
      flashlightGroup.rotation.x=
        -.12+Math.sin(elapsed*1.1)*.018;

      flashlightGroup.rotation.z=
        -.12+Math.sin(elapsed*.7)*.025;
    }
  }

  if(particles){
    particles.rotation.y=
      Math.sin(elapsed*.12)*.025;
  }

  renderer.render(scene,camera);
}

// BOTÃO JOGAR
document.getElementById("play").addEventListener("click",()=>{

  const transition=document.getElementById("transition");

  transition.style.display="flex";

  setTimeout(()=>{
    transition.querySelector("p").textContent=
      "A PRÓXIMA ETAPA SERÁ CONSTRUÍDA EM BREVE...";
  },1800);
});

// ERROS
try{
  init();
}catch(error){

  console.error(error);

  container.innerHTML=
    '<div style="color:white;padding:30px">Não foi possível iniciar o gráfico 3D. Tente outro navegador.</div>';
}
</script>

</body>
</html>
