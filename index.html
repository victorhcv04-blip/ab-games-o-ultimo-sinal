<script>
const container=document.getElementById("scene");

let scene,camera,renderer;
let particles;
let flashlightGroup;
let flashlightBeam;
let clock=new THREE.Clock();
let elapsed=0;

const dummy=new THREE.Object3D();

function random(min,max){
  return Math.random()*(max-min)+min;
}

// TEXTURA ULTRA DA CASCA
function createBarkTexture(){

  const canvas=document.createElement("canvas");
  canvas.width=1024;
  canvas.height=1024;

  const ctx=canvas.getContext("2d");

  const gradient=ctx.createLinearGradient(0,0,1024,0);
  gradient.addColorStop(0,"#30251b");
  gradient.addColorStop(.25,"#594331");
  gradient.addColorStop(.5,"#39291e");
  gradient.addColorStop(.75,"#654b34");
  gradient.addColorStop(1,"#30251b");

  ctx.fillStyle=gradient;
  ctx.fillRect(0,0,1024,1024);

  // Fibras verticais da madeira
  for(let i=0;i<1800;i++){

    const x=random(0,1024);
    const y=random(0,1024);
    const h=random(20,190);

    ctx.strokeStyle=`rgba(${random(5,45)},${random(4,30)},${random(2,18)},${random(.12,.48)})`;
    ctx.lineWidth=random(1,7);

    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.bezierCurveTo(
      x+random(-10,10),y+h*.3,
      x+random(-8,8),y+h*.7,
      x+random(-5,5),y+h
    );
    ctx.stroke();
  }

  // Pequenas rachaduras
  for(let i=0;i<350;i++){

    const x=random(0,1024);
    const y=random(0,1024);

    ctx.strokeStyle="rgba(8,7,5,.5)";
    ctx.lineWidth=random(1,3);

    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(x+random(-5,5),y+random(15,65));
    ctx.stroke();
  }

  // Manchas naturais
  for(let i=0;i<500;i++){

    ctx.fillStyle=`rgba(120,91,56,${random(.025,.12)})`;

    ctx.beginPath();
    ctx.ellipse(
      random(0,1024),
      random(0,1024),
      random(3,22),
      random(5,35),
      random(0,Math.PI),
      0,
      Math.PI*2
    );
    ctx.fill();
  }

  const texture=new THREE.CanvasTexture(canvas);
  texture.wrapS=THREE.RepeatWrapping;
  texture.wrapT=THREE.RepeatWrapping;
  texture.colorSpace=THREE.SRGBColorSpace;

  return texture;
}

// TEXTURA ULTRA DO SOLO
function createGroundTexture(){

  const canvas=document.createElement("canvas");
  canvas.width=1024;
  canvas.height=1024;

  const ctx=canvas.getContext("2d");

  ctx.fillStyle="#302c21";
  ctx.fillRect(0,0,1024,1024);

  // Terra e pequenas pedras
  for(let i=0;i<22000;i++){

    const x=random(0,1024);
    const y=random(0,1024);
    const size=random(1,5);
    const shade=Math.floor(random(20,75));

    ctx.fillStyle=`rgba(${shade},${shade*.9},${shade*.65},${random(.12,.5)})`;
    ctx.fillRect(x,y,size,size);
  }

  // Folhas secas
  for(let i=0;i<2200;i++){

    const x=random(0,1024);
    const y=random(0,1024);

    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(random(0,Math.PI));

    ctx.fillStyle=[
      "#625039","#493c27","#796044",
      "#352f22","#6b5438","#443d2a"
    ][Math.floor(random(0,6))];

    ctx.beginPath();
    ctx.ellipse(0,0,random(2,8),random(1,3),0,0,Math.PI*2);
    ctx.fill();

    ctx.restore();
  }

  // Musgo espalhado
  for(let i=0;i<850;i++){

    ctx.fillStyle=`rgba(49,91,48,${random(.08,.25)})`;

    ctx.beginPath();
    ctx.arc(
      random(0,1024),
      random(0,1024),
      random(2,12),
      0,
      Math.PI*2
    );
    ctx.fill();
  }

  const texture=new THREE.CanvasTexture(canvas);
  texture.wrapS=THREE.RepeatWrapping;
  texture.wrapT=THREE.RepeatWrapping;
  texture.repeat.set(5,12);
  texture.colorSpace=THREE.SRGBColorSpace;

  return texture;
}

// FLORESTA ULTRA
function createForest(){

  const count=280;
  const barkTexture=createBarkTexture();

  // TRONCOS
  const trunkGeometry=new THREE.CylinderGeometry(
    .38,.72,14,10,5
  );

  const trunkMaterial=new THREE.MeshStandardMaterial({
    map:barkTexture,
    color:0x9a8065,
    roughness:1
  });

  const trunks=new THREE.InstancedMesh(
    trunkGeometry,
    trunkMaterial,
    count
  );

  // GALHOS
  const branchGeometry=new THREE.CylinderGeometry(
    .045,.14,1,7
  );

  const branchMaterial=new THREE.MeshStandardMaterial({
    map:barkTexture,
    color:0x806044,
    roughness:1
  });

  const branches=new THREE.InstancedMesh(
    branchGeometry,
    branchMaterial,
    count*4
  );

  // COPAS ARREDONDADAS
  const leafGeometry=new THREE.IcosahedronGeometry(1,1);

  // Pequenas irregularidades na geometria
  const positions=leafGeometry.attributes.position;

  for(let i=0;i<positions.count;i++){

    const variation=random(.88,1.13);

    positions.setXYZ(
      i,
      positions.getX(i)*variation,
      positions.getY(i)*variation,
      positions.getZ(i)*variation
    );
  }

  leafGeometry.computeVertexNormals();

  const leafMaterial=new THREE.MeshStandardMaterial({
    color:0x24452b,
    roughness:1,
    flatShading:true
  });

  const leaves=new THREE.InstancedMesh(
    leafGeometry,
    leafMaterial,
    count*7
  );

  // CAMADAS DE COPAS EM FORMATO DE ÁRVORE
  const coneGeometry=new THREE.ConeGeometry(1,1,9,2);

  const coneMaterial=new THREE.MeshStandardMaterial({
    color:0x172f20,
    roughness:1,
    flatShading:true
  });

  const cones=new THREE.InstancedMesh(
    coneGeometry,
    coneMaterial,
    count*3
  );

  // RAÍZES GROSSAS
  const rootGeometry=new THREE.CylinderGeometry(
    .055,.19,1,7
  );

  const rootMaterial=new THREE.MeshStandardMaterial({
    color:0x392b20,
    roughness:1
  });

  const roots=new THREE.InstancedMesh(
    rootGeometry,
    rootMaterial,
    count*4
  );

  let branchIndex=0;
  let leafIndex=0;
  let coneIndex=0;
  let rootIndex=0;

  for(let i=0;i<count;i++){

    const side=Math.random()<.5?-1:1;

    // Mantém o corredor central livre
    const x=side*random(5.2,29);
    const z=random(-245,22);

    const height=random(10,19);
    const width=random(.85,1.55);

    // Tronco
    dummy.position.set(x,height/2,z);

    dummy.scale.set(
      width,
      height/14,
      width
    );

    dummy.rotation.set(
      random(-.035,.035),
      random(0,Math.PI),
      random(-.035,.035)
    );

    dummy.updateMatrix();
    trunks.setMatrixAt(i,dummy.matrix);

    // Variação de cor dos troncos
    trunks.setColorAt(
      i,
      new THREE.Color().setHSL(
        random(.055,.095),
        random(.18,.32),
        random(.22,.38)
      )
    );

    // GALHOS EM DIFERENTES ALTURAS
    for(let b=0;b<4;b++){

      const angle=random(0,Math.PI*2);
      const branchLength=random(1.4,3.1);

      const startY=height*random(.48,.83);

      const start=new THREE.Vector3(
        x,
        startY,
        z
      );

      const end=new THREE.Vector3(
        x+Math.cos(angle)*branchLength,
        startY+random(.6,1.8),
        z+Math.sin(angle)*branchLength
      );

      const direction=new THREE.Vector3()
        .subVectors(end,start);

      const length=direction.length();

      dummy.position.copy(start).add(end).multiplyScalar(.5);
      dummy.scale.set(.9,length,.9);

      dummy.quaternion.setFromUnitVectors(
        new THREE.Vector3(0,1,0),
        direction.normalize()
      );

      dummy.updateMatrix();

      branches.setMatrixAt(branchIndex,dummy.matrix);
      branchIndex++;
    }

    // COPA CENTRAL E MASSAS DE FOLHAS
    for(let c=0;c<7;c++){

      let offsetX=0;
      let offsetZ=0;
      let offsetY=height*.73;

      let size=random(1.1,2.1);

      if(c!==0){

        const angle=(c/6)*Math.PI*2;

        offsetX=Math.cos(angle)*random(.7,1.8);
        offsetZ=Math.sin(angle)*random(.7,1.8);
        offsetY+=random(-1.4,1.4);
      }

      dummy.position.set(
        x+offsetX,
        offsetY,
        z+offsetZ
      );

      dummy.scale.set(
        size*width,
        size*random(.8,1.4),
        size*width
      );

      dummy.rotation.set(
        random(0,Math.PI),
        random(0,Math.PI),
        random(0,Math.PI)
      );

      dummy.updateMatrix();

      leaves.setMatrixAt(leafIndex,dummy.matrix);

      leaves.setColorAt(
        leafIndex,
        new THREE.Color().setHSL(
          random(.25,.34),
          random(.32,.55),
          random(.12,.23)
        )
      );

      leafIndex++;
    }

    // COPAS EM CAMADAS
    for(let layer=0;layer<3;layer++){

      const scale=2.2-layer*.43;

      dummy.position.set(
        x+random(-.3,.3),
        height*(.48+layer*.12),
        z+random(-.3,.3)
      );

      dummy.scale.set(
        scale*width,
        random(3.5,5.2),
        scale*width
      );

      dummy.rotation.set(
        random(-.08,.08),
        random(0,Math.PI),
        random(-.08,.08)
      );

      dummy.updateMatrix();

      cones.setMatrixAt(coneIndex,dummy.matrix);

      cones.setColorAt(
        coneIndex,
        new THREE.Color().setHSL(
          random(.25,.34),
          random(.35,.55),
          random(.09,.18)
        )
      );

      coneIndex++;
    }

    // RAÍZES ESPALHADAS PELO CHÃO
    for(let r=0;r<4;r++){

      const angle=(r/4)*Math.PI*2+random(-.35,.35);
      const length=random(1.3,2.8);

      const start=new THREE.Vector3(
        x,
        .15,
        z
      );

      const end=new THREE.Vector3(
        x+Math.cos(angle)*length,
        .035,
        z+Math.sin(angle)*length
      );

      const direction=new THREE.Vector3()
        .subVectors(end,start);

      dummy.position.copy(start).add(end).multiplyScalar(.5);
      dummy.scale.set(.85,direction.length(),.85);

      dummy.quaternion.setFromUnitVectors(
        new THREE.Vector3(0,1,0),
        direction.normalize()
      );

      dummy.updateMatrix();

      roots.setMatrixAt(rootIndex,dummy.matrix);
      rootIndex++;
    }
  }

  trunks.instanceMatrix.needsUpdate=true;
  branches.instanceMatrix.needsUpdate=true;
  leaves.instanceMatrix.needsUpdate=true;
  cones.instanceMatrix.needsUpdate=true;
  roots.instanceMatrix.needsUpdate=true;

  scene.add(trunks);
  scene.add(branches);
  scene.add(leaves);
  scene.add(cones);
  scene.add(roots);
}

// PEDRAS
function createRocks(){

  const geometry=new THREE.DodecahedronGeometry(1,0);

  const material=new THREE.MeshStandardMaterial({
    color:0x41443d,
    roughness:1,
    flatShading:true
  });

  const rocks=new THREE.InstancedMesh(
    geometry,material,220
  );

  for(let i=0;i<220;i++){

    const side=Math.random()<.5?-1:1;

    dummy.position.set(
      side*random(2,35),
      random(.05,.2),
      random(-240,20)
    );

    dummy.scale.set(
      random(.12,.8),
      random(.1,.4),
      random(.15,.75)
    );

    dummy.rotation.set(
      random(0,2),
      random(0,Math.PI),
      random(0,2)
    );

    dummy.updateMatrix();
    rocks.setMatrixAt(i,dummy.matrix);
  }

  rocks.instanceMatrix.needsUpdate=true;
  scene.add(rocks);
}

// VEGETAÇÃO DENSA
function createVegetation(){

  // Capim
  const grassGeometry=new THREE.ConeGeometry(.16,1.2,5);

  const grassMaterial=new THREE.MeshStandardMaterial({
    color:0x263e25,
    roughness:1,
    flatShading:true
  });

  const plants=new THREE.InstancedMesh(
    grassGeometry,
    grassMaterial,
    1400
  );

  // Arbustos
  const bushGeometry=new THREE.IcosahedronGeometry(1,1);

  const bushMaterial=new THREE.MeshStandardMaterial({
    color:0x1b3520,
    roughness:1,
    flatShading:true
  });

  const bushes=new THREE.InstancedMesh(
    bushGeometry,
    bushMaterial,
    500
  );

  for(let i=0;i<1400;i++){

    const side=Math.random()<.5?-1:1;

    dummy.position.set(
      side*random(2,25),
      .45,
      random(-240,20)
    );

    dummy.scale.set(
      random(.5,1.6),
      random(.4,2),
      random(.5,1.6)
    );

    dummy.rotation.set(
      random(-.2,.2),
      random(0,Math.PI),
      random(-.2,.2)
    );

    dummy.updateMatrix();
    plants.setMatrixAt(i,dummy.matrix);
  }

  for(let i=0;i<500;i++){

    const side=Math.random()<.5?-1:1;

    dummy.position.set(
      side*random(3,25),
      random(.3,.8),
      random(-240,20)
    );

    dummy.scale.set(
      random(.5,1.5),
      random(.35,.9),
      random(.5,1.4)
    );

    dummy.rotation.set(
      random(0,1),
      random(0,Math.PI),
      random(0,1)
    );

    dummy.updateMatrix();
    bushes.setMatrixAt(i,dummy.matrix);
  }

  plants.instanceMatrix.needsUpdate=true;
  bushes.instanceMatrix.needsUpdate=true;

  scene.add(plants);
  scene.add(bushes);
}

// CHÃO
function createGround(){

  const geometry=new THREE.PlaneGeometry(
    100,280,80,160
  );

  const texture=createGroundTexture();

  const material=new THREE.MeshStandardMaterial({
    map:texture,
    color:0x999487,
    roughness:1
  });

  const ground=new THREE.Mesh(geometry,material);

  ground.rotation.x=-Math.PI/2;
  ground.position.set(0,-.08,-100);

  scene.add(ground);
}

// PARTÍCULAS
function createParticles(){

  const positions=[];

  for(let i=0;i<450;i++){

    positions.push(
      random(-35,35),
      random(.2,13),
      random(-240,20)
    );
  }

  const geometry=new THREE.BufferGeometry();

  geometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(positions,3)
  );

  const material=new THREE.PointsMaterial({
    color:0xa5bba9,
    size:.045,
    transparent:true,
    opacity:.3,
    depthWrite:false
  });

  particles=new THREE.Points(geometry,material);
  scene.add(particles);
}

// LANTERNA NA MÃO DO JOGADOR
function createFlashlight(){

  flashlightGroup=new THREE.Group();

  const bodyMaterial=new THREE.MeshStandardMaterial({
    color:0x171b1b,
    metalness:.8,
    roughness:.32
  });

  const body=new THREE.Mesh(
    new THREE.CylinderGeometry(.065,.075,.42,16),
    bodyMaterial
  );

  body.rotation.x=Math.PI/2;
  body.position.z=-.13;
  flashlightGroup.add(body);

  const head=new THREE.Mesh(
    new THREE.CylinderGeometry(.115,.085,.14,20),
    new THREE.MeshStandardMaterial({
      color:0x292f2e,
      metalness:.85,
      roughness:.25
    })
  );

  head.rotation.x=Math.PI/2;
  head.position.z=-.39;
  flashlightGroup.add(head);

  const ring=new THREE.Mesh(
    new THREE.TorusGeometry(.103,.012,8,24),
    new THREE.MeshStandardMaterial({
      color:0x89938e,
      metalness:.95,
      roughness:.2
    })
  );

  ring.position.z=-.465;
  flashlightGroup.add(ring);

  const lens=new THREE.Mesh(
    new THREE.CircleGeometry(.087,24),
    new THREE.MeshBasicMaterial({
      color:0xd8f0d8
    })
  );

  lens.position.z=-.468;
  flashlightGroup.add(lens);

  const switchButton=new THREE.Mesh(
    new THREE.SphereGeometry(.025,10,8),
    new THREE.MeshStandardMaterial({
      color:0x69d995,
      metalness:.4,
      roughness:.4
    })
  );

  switchButton.position.set(.075,.025,-.12);
  flashlightGroup.add(switchButton);

  const glove=new THREE.Mesh(
    new THREE.SphereGeometry(1,16,12),
    new THREE.MeshStandardMaterial({
      color:0x252b28,
      roughness:1
    })
  );

  glove.scale.set(.115,.095,.16);
  glove.position.set(-.09,-.11,.015);
  flashlightGroup.add(glove);

  const cuff=new THREE.Mesh(
    new THREE.CylinderGeometry(.075,.085,.16,10),
    new THREE.MeshStandardMaterial({
      color:0x171d19,
      roughness:1
    })
  );

  cuff.rotation.x=Math.PI/2;
  cuff.position.set(-.09,-.105,.14);
  flashlightGroup.add(cuff);

  flashlightGroup.position.set(.46,-.39,-.78);
  flashlightGroup.rotation.set(-.12,-.08,-.12);

  camera.add(flashlightGroup);

  const beamGeometry=new THREE.CylinderGeometry(
    2.15,.075,8,24,1,true
  );

  const beamMaterial=new THREE.MeshBasicMaterial({
    color:0xd9f4d7,
    transparent:true,
    opacity:.045,
    side:THREE.DoubleSide,
    depthWrite:false,
    blending:THREE.AdditiveBlending
  });

  flashlightBeam=new THREE.Mesh(
    beamGeometry,
    beamMaterial
  );

  flashlightBeam.rotation.x=-Math.PI/2;
  flashlightBeam.position.set(.46,-.39,-4.78);

  camera.add(flashlightBeam);

  const spot=new THREE.SpotLight(
    0xe0f4dc,
    85,
    32,
    .38,
    .65,
    1.4
  );

  spot.position.set(.46,-.36,-.72);

  const target=new THREE.Object3D();
  target.position.set(.46,-.65,-25);

  camera.add(spot);
  camera.add(target);

  spot.target=target;

  const glow=new THREE.PointLight(
    0xc9efc6,
    1.5,
    4
  );

  glow.position.set(.46,-.36,-.85);
  camera.add(glow);
}

  );

  const ambient=new THREE.AmbientLight(

  );

  scene.add(ambient);
}

// INICIALIZAÇÃO
function init(){

  scene=new THREE.Scene();

  scene.background=new THREE.Color(0x030805);
  scene.fog=new THREE.FogExp2(0x071009,.014);

  camera=new THREE.PerspectiveCamera(
    65,
    window.innerWidth/window.innerHeight,
    .1,
    300
  );

  camera.position.set(0,2.2,12);
  camera.rotation.order="YXZ";

  const isMobile=/Android|iPhone|iPad/i.test(
    navigator.userAgent
  );

  renderer=new THREE.WebGLRenderer({
    antialias:!isMobile,
    powerPreference:"high-performance"
  });

  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio||1,1.35)
  );

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.1;

  container.appendChild(renderer.domElement);

  createLighting();
  createGround();
  createForest();
  createRocks();
  createVegetation();
  createParticles();
  createFlashlight();

  window.addEventListener("resize",resize);

  animate();
}

// TAMANHO DA TELA
function resize(){

  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio||1,1.35)
  );
}

// ANIMAÇÃO
function animate(){

  requestAnimationFrame(animate);

  const delta=Math.min(clock.getDelta(),.05);
  elapsed+=delta;

  const transition=document.getElementById("transition");

  if(transition.style.display!=="flex"){

    camera.position.z=12-elapsed*.28;

    camera.position.y=
      2.2+Math.sin(elapsed*.45)*.045;

    camera.position.x=
      Math.sin(elapsed*.22)*.25;

    if(flashlightGroup){

      flashlightGroup.rotation.x=
        -.12+Math.sin(elapsed*1.1)*.018;

      flashlightGroup.rotation.z=
        -.12+Math.sin(elapsed*.7)*.025;
    }
  }

  if(particles){

    particles.rotation.y=
      Math.sin(elapsed*.12)*.025;
  }

  renderer.render(scene,camera);
}

// BOTÃO JOGAR
document.getElementById("play").addEventListener("click",()=>{

  const transition=document.getElementById("transition");

  transition.style.display="flex";

  setTimeout(()=>{

    transition.querySelector("p").textContent=
      "A PRÓXIMA ETAPA SERÁ CONSTRUÍDA EM BREVE...";

  },1800);
});

// ERROS
try{

  init();

}catch(error){

  console.error(error);

  container.innerHTML=
    '<div style="color:white;padding:30px">Não foi possível iniciar o gráfico 3D. Tente outro navegador.</div>';
}
</script>

</body>
</html>
